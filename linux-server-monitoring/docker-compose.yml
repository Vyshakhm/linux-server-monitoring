services:
  exporter:
    build: .
    container_name: linux-monitor-exporter
    ports:
      - "8000:8000"
    pid: host
    environment:
      HOST_PROC: /host/proc
    volumes:
      - /proc:/host/proc:ro
      - /:/host/root:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: linux-monitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: linux-monitor-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/linux-monitoring.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
